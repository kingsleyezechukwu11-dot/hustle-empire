<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hustle Empire Street</title>
<style>
  html,body{margin:0;height:100%;background:#cfe3f1;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #joy{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);pointer-events:none;opacity:.55}
  #joy.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="joy"><div id="knob"></div></div>
<script>/*BUNDLE*/</script>
</body>
</html>
